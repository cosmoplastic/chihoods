<!DOCTYPE html>
<!--  chicago-neighborhoods v1.6 -->
<!-- v1.6: modern makeover (glass panels over the map, HUD progress bar, switch toggle).
     v1.1: optional CTA 'L' rail-line overlay (toggle in HUD).
     v1.0: tap-the-map quiz of Chicago's 77 official community areas. Self-contained,
     offline-capable (Leaflet vendored locally, no map tiles). Mobile-first. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050d14" />
    <title>Chicago Neighborhoods — Learn the Map</title>

    <!-- Favicon + iOS "Add to Home Screen" icon. iOS uses apple-touch-icon (not the
       favicon or any manifest) for the home-screen tile, and flattens transparency
       onto a background, so apple-touch-icon.png is a pre-flattened opaque 180×180. -->
    <link rel="icon" type="image/png" href="assets/icon.png?v=1.6" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=1.6" />
    <meta name="apple-mobile-web-app-title" content="ChicagoHoods" />

    <!-- Launch fullscreen (no Safari chrome) when opened from the home screen.
       black-translucent lets the map bleed under the status bar; the HUD already
       pads for it via the safe-area-inset (--safe-t) variables in style.css. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=1.6" />
  </head>
  <body>
    <div id="map" aria-label="Map of Chicago community areas"></div>

    <!-- Top HUD: progress & controls -->
    <header id="hud" class="hidden">
      <div class="hud-bar">
        <div class="hud-row hud-meta">
          <span id="progress" class="meta-chip meta-progress">0 / 0</span>
          <span id="score" class="meta-chip">0 correct</span>
          <span id="streak" class="meta-chip">🔥 0</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progress-fill" class="progress-fill"></span>
        </div>
      </div>
      <button id="settings-btn" class="btn icon-btn" type="button"
        aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7" />
          <line x1="4" y1="17" x2="20" y2="17" />
          <circle cx="9" cy="7" r="2.2" fill="currentColor" />
          <circle cx="15" cy="17" r="2.2" fill="currentColor" />
        </svg>
      </button>
    </header>

    <!-- Bottom controls during play -->
    <footer id="controls" class="hidden">
      <!-- Tap mode: name shown, tap the map -->
      <div id="tap-controls">
        <div class="prompt-section">
          <div class="prompt">
            <span class="prompt-label">Find</span>
            <span id="target" class="prompt-name">—</span>
            <span id="target-sub" class="prompt-sub"></span>
          </div>
        </div>
        <div class="button-row">
          <button id="hint-btn" class="btn btn-secondary" type="button"
            aria-label="Hint">Hint</button>
          <button id="skip-btn" class="btn btn-tertiary" type="button">Skip,
            show me</button>
        </div>
      </div>

      <!-- Choice mode: area highlighted on the map, pick its name -->
      <div id="choice-controls" class="hidden">
        <div class="prompt-section">
          <div class="prompt">
            <span class="prompt-label">Name the highlighted area</span>
          </div>
        </div>
        <div id="choices" class="choices-grid"></div>
        <div class="button-row">
          <button id="choice-skip-btn" class="btn btn-tertiary"
            type="button">Skip, show me</button>
        </div>
      </div>
    </footer>

    <div id="toast" class="hidden" role="status" aria-live="polite"></div>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <div class="card card-hero">
        <div class="stars" aria-hidden="true">
          <img src="assets/flag-stars.svg" alt />
        </div>
        <h1 class="title">Chicago<span class="accent">Hoods</span></h1>
        <p class="subtitle">Tap the highlighted neighborhood on the map. Learn
          all 77 community areas before you move back.</p>

        <div class="opt-group">
          <label class="opt-label">Mode</label>
          <div class="segmented" id="mode-seg" role="radiogroup">
            <button class="seg active" data-mode="tap" role="radio"
              aria-checked="true">Find on map</button>
            <button class="seg" data-mode="choice" role="radio"
              aria-checked="false">Name the area</button>
          </div>
        </div>

        <div class="opt-group">
          <label class="opt-label">Region</label>
          <select id="region-select" class="select"></select>
        </div>

        <div class="opt-group">
          <label class="opt-label">Length</label>
          <div class="segmented" id="length-seg" role="radiogroup">
            <button class="seg" data-len="10" role="radio"
              aria-checked="true">Quick · 10</button>
            <button class="seg active" data-len="all" role="radio"
              aria-checked="false">Full set</button>
          </div>
        </div>

        <button id="start-btn" class="btn btn-primary btn-lg btn-block"
          type="button">Start</button>
        <p class="footnote" id="best-line"></p>
        <button id="export-btn" class="btn btn-tertiary btn-sm export-btn"
          type="button">Export scores (JSON)</button>
      </div>
    </div>

    <!-- Settings / pause menu (opened from the HUD gear during play) -->
    <div id="settings-screen" class="overlay hidden">
      <div class="card">
        <h2 class="title small">Settings</h2>

        <div class="setting-row">
          <span class="setting-label">Show ‘L’ train lines</span>
          <button id="l-lines-toggle" class="toggle active" type="button"
            aria-pressed="true"
            aria-label="Show L train lines">On</button>
        </div>

        <div class="settings-actions">
          <button id="resume-btn" class="btn btn-primary btn-lg btn-block"
            type="button">Resume</button>
          <button id="restart-btn" class="btn btn-secondary btn-block"
            type="button">Restart game</button>
          <button id="quit-btn" class="btn btn-tertiary btn-block"
            type="button">Quit to menu</button>
        </div>
      </div>
    </div>

    <!-- End screen -->
    <div id="end-screen" class="overlay hidden">
      <div class="card">
        <h2 class="title small">Round complete</h2>
        <div class="result-grid">
          <div class="result-stat"><span id="r-score"
              class="result-num">0</span><span
              class="result-cap">correct</span></div>
          <div class="result-stat"><span id="r-acc"
              class="result-num">0%</span><span
              class="result-cap">accuracy</span></div>
          <div class="result-stat"><span id="r-streak"
              class="result-num">0</span><span class="result-cap">best
              streak</span></div>
        </div>
        <div id="missed-wrap" class="missed-wrap hidden">
          <p class="missed-title">Worth another look</p>
          <ul id="missed-list" class="missed-list"></ul>
        </div>
        <button id="again-btn" class="btn btn-primary btn-lg btn-block"
          type="button">Play
          again</button>
      </div>
    </div>

    <script src="vendor/leaflet.js?v=1.6"></script>
    <script src="data/community-areas.js?v=1.6"></script>
    <script src="data/cta-l-lines.js?v=1.6"></script>
    <script src="game.js?v=1.6"></script>
  </body>
</html>
